name: Publish to npm

on:
  workflow_dispatch:
  push:
    branches: [main]

# Only one publish at a time
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    environment: npm-production
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to push version bump commit
      id-token: write   # for npm trusted publishing and provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify publishing runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Check if version changed
        id: version_check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view opensource-showcase version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Auto-bump patch if version hasn't been manually bumped
      - name: Auto-bump version
        if: steps.version_check.outputs.changed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore: release v%s [skip ci]"
          git push --follow-tags

      - name: Run CI checks (Lint, Type-check, Test, Build)
        run: npm run prepublishOnly

      # NPM_TOKEN must have publishing access to this package.
      # OIDC remains available if a matching Trusted Publisher is configured.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published version on npm
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5 6; do
            if PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org); then
              if [ "$PUBLISHED_VERSION" = "$PACKAGE_VERSION" ]; then
                echo "Verified $PACKAGE_NAME@$PACKAGE_VERSION is publicly available."
                exit 0
              fi
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          echo "::error::$PACKAGE_NAME@$PACKAGE_VERSION is not available on npm after publishing. Check the publish step result and npm authorization; provenance signing alone is not publication."
          exit 1
