name: Publish to npm

on:
  workflow_dispatch:
  push:
    branches: [main]

# Only one publish at a time
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    environment: npm-production
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to push version bump commit
      id-token: write   # for npm trusted publishing and provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify publishing runtime
        run: |
          node --version
          npm --version

      - name: Check npm token authentication
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is missing. Add it to this repository or its npm-production environment."
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org
          echo "Token authentication succeeded. Package write access is checked by npm during publishing."

      - name: Install dependencies
        run: npm ci

      - name: Select and commit a fresh release version
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PUBLISHED_VERSIONS=$(npm view "$PACKAGE_NAME" versions --json --registry=https://registry.npmjs.org)
          export PUBLISHED_VERSIONS
          NEXT_VERSION=$(node --input-type=commonjs -e '
            const local = require("./package.json").version;
            const published = JSON.parse(process.env.PUBLISHED_VERSIONS);
            const versions = [local, ...[].concat(published)]
              .filter(v => /^\d+\.\d+\.\d+$/.test(v))
              .map(v => v.split(".").map(Number))
              .sort((a, b) => b[0] - a[0] || b[1] - a[1] || b[2] - a[2]);
            const [major, minor, patch] = versions[0];
            console.log(`${major}.${minor}.${patch + 1}`);
          ')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "$NEXT_VERSION" -m "chore: release v%s [skip ci]"
          git push --follow-tags

      - name: Run CI checks (Lint, Type-check, Test, Build)
        run: npm run prepublishOnly

      # NPM_TOKEN must have publishing access to this package.
      # OIDC remains available if a matching Trusted Publisher is configured.
      - name: Publish to npm
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org --dry-run=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published version on npm
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5 6; do
            if PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org); then
              if [ "$PUBLISHED_VERSION" = "$PACKAGE_VERSION" ]; then
                echo "Verified $PACKAGE_NAME@$PACKAGE_VERSION is publicly available."
                exit 0
              fi
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          echo "::error::$PACKAGE_NAME@$PACKAGE_VERSION is not available on npm after publishing. Check the publish step result and npm authorization; provenance signing alone is not publication."
          exit 1
